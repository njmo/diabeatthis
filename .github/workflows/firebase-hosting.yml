name: Firebase Hosting

on:
  push:
    branches: [develop]
    paths:
      - "hosting/**"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

concurrency:
  group: diabeatthis-firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check static site and prepare Firebase CLI
        run: |
          test -s hosting/public/index.html
          test -s hosting/public/privacy/index.html
          test -s hosting/public/en/index.html
          test -s hosting/public/en/privacy/index.html
          test -s hosting/public/styles.css
          test -s hosting/public/icon.png
          npx --yes firebase-tools@15.36.0 --version

      - uses: google-github-actions/auth@v3
        with:
          project_id: diabeatthis-e634c
          workload_identity_provider: ${{ vars.FIREBASE_HOSTING_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_HOSTING_SERVICE_ACCOUNT }}

      - name: Publish only Firebase Hosting
        run: |
          npx --yes firebase-tools@15.36.0 deploy \
            --project diabeatthis-e634c --config hosting/firebase.json \
            --only hosting --non-interactive
