name: Android release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
      - "v*.*.*-android"
      - "v*.*.*-android-phone"
      - "v*.*.*-android-testing"
      - "v*.*.*-android-wear"
      - "v*.*.*-android-both"
      - "v*.*.*-android-all"
      - "v*.*.*-all"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Android versionName, for example 1.0.2"
        required: true
        default: "1.0.0"
        type: string
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Google Play release status"
        required: true
        default: "completed"
        type: choice
        options:
          - draft
          - completed
      wear_only:
        description: "Build only the Wear OS bundle and APK"
        type: boolean
        default: false
      release_wear:
        description: "Also release Wear OS to the Diabeatthis closed test"
        type: boolean
        default: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GOOGLE_PLAY_RELEASE_STATUS: ${{ github.event.inputs.release_status || 'completed' }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Resolve release scope and version
        env:
          MANUAL_RELEASE_VERSION: ${{ inputs.release_version }}
          MANUAL_TRACK: ${{ inputs.track }}
          MANUAL_WEAR_ONLY: ${{ inputs.wear_only }}
          MANUAL_RELEASE_WEAR: ${{ inputs.release_wear }}
        run: |
          version="$MANUAL_RELEASE_VERSION"
          track="${MANUAL_TRACK:-internal}"
          build_phone=true
          build_wear=false
          publish_wear=false
          github_release=false
          github_only_testing=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-all|-android(-phone|-wear|-both|-all|-testing)?)?$ ]]; then
              echo "::error::Invalid Android release tag"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            track=alpha
            case "${BASH_REMATCH[2]}" in
              -android-phone) ;;
              -android-testing)
                github_release=true
                github_only_testing=true
                ;;
              -android-wear) build_phone=false; build_wear=true; publish_wear=true ;;
              -all|-android|-android-both|-android-all)
                build_wear=true
                publish_wear=true
                github_release=true
                ;;
              "")
                track=internal
                build_wear=true
                github_release=true
                ;;
            esac
          else
            if [[ "$MANUAL_WEAR_ONLY" == true ]]; then
              build_phone=false
              build_wear=true
            fi
            if [[ "$MANUAL_RELEASE_WEAR" == true ]]; then
              if [[ "$build_phone" == true && "$track" != alpha ]]; then
                echo "::error::diabeatthis-wearos is a closed test paired with the phone alpha track."
                exit 1
              fi
              build_wear=true
              publish_wear=true
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an Android version in X.Y.Z format"
            exit 1
          fi
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_BUILD_NUMBER=$GITHUB_RUN_NUMBER"
            echo "GOOGLE_PLAY_TRACK=$track"
            echo "BUILD_PHONE=$build_phone"
            echo "BUILD_WEAR=$build_wear"
            echo "RELEASE_WEAR_TO_CLOSED_TEST=$publish_wear"
            echo "CREATE_GITHUB_RELEASE=$github_release"
            echo "GITHUB_ONLY_TESTING_RELEASE=$github_only_testing"
          } >> "$GITHUB_ENV"

      - name: Verify Google Play credentials
        if: ${{ (env.BUILD_PHONE == 'true' && env.GITHUB_ONLY_TESTING_RELEASE != 'true') || env.RELEASE_WEAR_TO_CLOSED_TEST == 'true' }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON before running an Android release"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        if: ${{ env.BUILD_PHONE == 'true' }}
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: ${{ env.BUILD_PHONE == 'true' }}
        run: flutter analyze lib test

      - name: Test
        if: ${{ env.BUILD_PHONE == 'true' }}
        run: flutter test

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release.jks"

      - name: Build signed app bundle
        if: ${{ env.BUILD_PHONE == 'true' && env.GITHUB_ONLY_TESTING_RELEASE != 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER"

      - name: Build signed APK
        if: ${{ env.BUILD_PHONE == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-name "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER"

      - name: Verify notification icon and Wear capability in signed APK
        if: ${{ env.BUILD_PHONE == 'true' }}
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$aapt2"
          "$aapt2" dump resources build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/android-apk-resources.txt"
          if ! grep -Fq 'drawable/ic_diabeatthis_notification' "$RUNNER_TEMP/android-apk-resources.txt"; then
            echo "::error::The release APK is missing the notification icon required during startup"
            exit 1
          fi
          if ! grep -Fq 'diabeatthis_meal_decision_phone' "$RUNNER_TEMP/android-apk-resources.txt"; then
            echo "::error::The release APK is missing the capability required for Wear OS to find the phone app"
            exit 1
          fi

      - name: Name Android release files
        if: ${{ env.BUILD_PHONE == 'true' }}
        run: |
          mkdir -p build/release-assets
          basename="diabeatthis-android-${RELEASE_VERSION}-b${RELEASE_BUILD_NUMBER}"
          if [[ "$GITHUB_ONLY_TESTING_RELEASE" != true ]]; then
            cp build/app/outputs/bundle/release/app-release.aab "build/release-assets/$basename.aab"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/$basename.apk"
          echo "ANDROID_RELEASE_BASENAME=$basename" >> "$GITHUB_ENV"

      - name: Upload app bundle artifact
        if: ${{ env.BUILD_PHONE == 'true' && env.GITHUB_ONLY_TESTING_RELEASE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_RELEASE_BASENAME }}-aab
          path: build/release-assets/${{ env.ANDROID_RELEASE_BASENAME }}.aab
          if-no-files-found: error

      - name: Build signed Wear OS bundle and APK
        if: ${{ env.BUILD_WEAR == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_PATH:?}" "${ANDROID_KEYSTORE_PASSWORD:?}" "${ANDROID_KEY_ALIAS:?}" "${ANDROID_KEY_PASSWORD:?}"
          test -s "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release --config-only --no-pub
          cd android
          # Keep Wear version codes distinct from the mobile workflow run numbers.
          wear_version_code=$((1000000 + RELEASE_BUILD_NUMBER))
          ./gradlew :wear:bundleRelease :wear:assembleRelease \
            "-PwearVersionCode=$wear_version_code" \
            "-PwearVersionName=$RELEASE_VERSION"
          test -s ../build/wear/outputs/bundle/release/wear-release.aab
          test -s ../build/wear/outputs/apk/release/wear-release.apk

      - name: Name Wear OS release files
        if: ${{ env.BUILD_WEAR == 'true' }}
        run: |
          mkdir -p build/release-assets
          wear_version_code=$((1000000 + RELEASE_BUILD_NUMBER))
          basename="diabeatthis-wearos-${RELEASE_VERSION}-b${wear_version_code}"
          cp build/wear/outputs/bundle/release/wear-release.aab "build/release-assets/$basename.aab"
          cp build/wear/outputs/apk/release/wear-release.apk "build/release-assets/$basename.apk"
          echo "WEAR_RELEASE_BASENAME=$basename" >> "$GITHUB_ENV"

      - name: Upload Wear OS app bundle artifact
        if: ${{ env.BUILD_WEAR == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WEAR_RELEASE_BASENAME }}-aab
          path: build/release-assets/${{ env.WEAR_RELEASE_BASENAME }}.aab
          if-no-files-found: error

      - name: Upload Wear OS APK artifact
        if: ${{ env.BUILD_WEAR == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WEAR_RELEASE_BASENAME }}-apk
          path: build/release-assets/${{ env.WEAR_RELEASE_BASENAME }}.apk
          if-no-files-found: error

      - name: Upload APK artifact
        if: ${{ env.BUILD_PHONE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_RELEASE_BASENAME }}-apk
          path: build/release-assets/${{ env.ANDROID_RELEASE_BASENAME }}.apk
          if-no-files-found: error

      - name: Generate Android release notes
        if: ${{ env.BUILD_PHONE == 'true' }}
        run: python3 .github/scripts/mobile_release_notes.py android "$RELEASE_VERSION" "$RUNNER_TEMP/android-release-notes"

      - name: Upload to Google Play
        if: ${{ env.BUILD_PHONE == 'true' && env.GITHUB_ONLY_TESTING_RELEASE != 'true' }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.diabeatthis.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ env.GOOGLE_PLAY_TRACK }}
          status: ${{ env.GOOGLE_PLAY_RELEASE_STATUS }}
          whatsNewDirectory: ${{ runner.temp }}/android-release-notes

      - name: Generate Wear OS release notes
        if: ${{ env.RELEASE_WEAR_TO_CLOSED_TEST == 'true' }}
        run: python3 .github/scripts/mobile_release_notes.py wear "$RELEASE_VERSION" "$RUNNER_TEMP/wear-release-notes"

      - name: Upload Wear OS to Google Play closed testing
        if: ${{ env.RELEASE_WEAR_TO_CLOSED_TEST == 'true' }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.diabeatthis.app
          releaseFiles: build/wear/outputs/bundle/release/wear-release.aab
          tracks: "wear:diabeatthis-wearos"
          status: ${{ env.GOOGLE_PLAY_RELEASE_STATUS }}
          whatsNewDirectory: ${{ runner.temp }}/wear-release-notes

      - name: Prepare GitHub Release description
        if: ${{ env.CREATE_GITHUB_RELEASE == 'true' }}
        run: |
          {
            echo '## Android — co nowego'
            cat "$RUNNER_TEMP/android-release-notes/whatsnew-pl-PL"
            printf '\n\n## Android — what’s new\n'
            cat "$RUNNER_TEMP/android-release-notes/whatsnew-en-US"
            printf '\n\n## Packages\n\n'
            if [[ "$GITHUB_ONLY_TESTING_RELEASE" == true ]]; then
              echo 'Testing APK for Android phones. Available only on GitHub.'
            else
              echo 'Android and Wear OS APKs and bundles signed by the GitHub release keystore.'
              echo 'The two APKs can be installed together. For a phone build installed from Google Play, use a Wear OS APK signed by Play App Signing.'
              printf '\nGoogle Play phone track: %s.\n' "$GOOGLE_PLAY_TRACK"
            fi
          } > "$RUNNER_TEMP/github-release.md"

      - name: Create GitHub Release
        if: ${{ env.CREATE_GITHUB_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/github-release.md
          prerelease: ${{ env.GITHUB_ONLY_TESTING_RELEASE == 'true' }}
          fail_on_unmatched_files: true
          files: build/release-assets/*
