name: CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "hosting/**"
      - ".github/workflows/firebase-hosting.yml"
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "hosting/**"
      - ".github/workflows/firebase-hosting.yml"

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for Android build
        shell: bash
        run: |
          df -h /
          # This job builds Android only; keep Java, Android SDK and NDK.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          sudo docker image prune --all --force
          df -h /

      - uses: ./.github/actions/setup-flutter-project

      - name: Analyze
        run: flutter analyze lib test

      - name: Test behavior coverage tools
        run: python3 -m unittest discover -s tool/testing -p 'test_*.py'

      - name: Build Android debug APK
        run: |
          df -h /
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          cat >> "$gradle_home/gradle.properties" <<'EOF'

          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx1g
          EOF
          flutter build apk --debug --no-pub

      - name: Report disk usage after Android build
        if: ${{ always() }}
        run: |
          df -h /
          du -sh build "$HOME/.gradle" "$ANDROID_HOME" "$FLUTTER_ROOT" || true

  test:
    name: Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter-project

      - name: Test with coverage
        run: >-
          flutter test --no-pub --coverage
          --total-shards=${{ strategy.job-total }}
          --shard-index=${{ matrix.shard }}

      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  flutter:
    needs: [checks, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks and all test shards
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          [[ "$CHECKS_RESULT" == success && "$TEST_RESULT" == success ]]

      - uses: actions/checkout@v4

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: flutter-coverage-*
          path: coverage/shards

      - name: Audit combined use case and controller coverage
        shell: bash
        run: |
          reports=(coverage/shards/flutter-coverage-*/lcov.info)
          [[ ${#reports[@]} -eq 4 ]]
          args=(--require-executed)
          for index in "${!reports[@]}"; do
            [[ -s "${reports[$index]}" ]]
            if [[ "$index" -eq 0 ]]; then
              args+=(--lcov "${reports[$index]}")
            else
              args+=(--additional-lcov "${reports[$index]}")
            fi
          done
          python3 tool/testing/audit_behavior_coverage.py "${args[@]}"
